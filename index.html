<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS v7 — every model, one hub</title>
<script>(function(){try{var s=JSON.parse(localStorage.getItem("nexus:s")||"{}");var m={harbor:"aurora",graphite:"obsidian",signal:"neon"};var t=m[s.theme]||s.theme;if(["aurora","obsidian","neon"].indexOf(t)<0)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"aurora":"obsidian";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --r-s:8px;--r-m:12px;--r-l:20px;
  --font-display:'Sora','Inter',system-ui,sans-serif;
  /* default = Aurora */
  --bg:#f3f1fb;--panel:rgba(255,255,255,.74);--raised:rgba(255,255,255,.72);--side-item:rgba(255,255,255,.45);--side-active:rgba(255,255,255,.96);
  --ink:#1c1b33;--ink-dim:#58577a;--ink-faint:#9291ad;--line:rgba(112,100,200,.20);
  --accent:#6c5ce7;--accent-ink:#ffffff;--accent-soft:rgba(108,92,231,.10);--ok:#169a68;--err:#d6405a;
  --glass:rgba(255,255,255,.62);--grid:transparent;
  --shadow:0 20px 60px -22px rgba(80,62,200,.38);
  --accent-grad:linear-gradient(135deg,#6c5ce7 0%,#9b5cf6 55%,#e056b8 100%);
  --btn-shadow:0 8px 22px -6px rgba(108,92,231,.55);--mark-shadow:0 6px 16px -4px rgba(108,92,231,.6);
  --user-bg:linear-gradient(135deg,rgba(108,92,231,.14),rgba(224,86,184,.10));--user-line:rgba(108,92,231,.28);
  --ico-bg:#ffffff;--ico-line:rgba(112,100,200,.22);
  --bg-img:radial-gradient(900px 620px at 6% -8%,rgba(167,139,250,.42),transparent 60%),radial-gradient(780px 560px at 102% 4%,rgba(94,234,212,.34),transparent 58%),radial-gradient(900px 700px at 55% 118%,rgba(251,146,200,.30),transparent 62%),#f4f2fc;
}
:root[data-theme="aurora"]{
  --font-display:'Sora','Inter',system-ui,sans-serif;
  --bg:#f3f1fb;--panel:rgba(255,255,255,.74);--raised:rgba(255,255,255,.72);--side-item:rgba(255,255,255,.45);--side-active:rgba(255,255,255,.96);
  --ink:#1c1b33;--ink-dim:#58577a;--ink-faint:#9291ad;--line:rgba(112,100,200,.20);
  --accent:#6c5ce7;--accent-ink:#ffffff;--accent-soft:rgba(108,92,231,.10);--ok:#169a68;--err:#d6405a;
  --glass:rgba(255,255,255,.62);--grid:transparent;
  --shadow:0 20px 60px -22px rgba(80,62,200,.38);
  --accent-grad:linear-gradient(135deg,#6c5ce7 0%,#9b5cf6 55%,#e056b8 100%);
  --btn-shadow:0 8px 22px -6px rgba(108,92,231,.55);--mark-shadow:0 6px 16px -4px rgba(108,92,231,.6);
  --user-bg:linear-gradient(135deg,rgba(108,92,231,.14),rgba(224,86,184,.10));--user-line:rgba(108,92,231,.28);
  --ico-bg:#ffffff;--ico-line:rgba(112,100,200,.22);
  --bg-img:radial-gradient(900px 620px at 6% -8%,rgba(167,139,250,.42),transparent 60%),radial-gradient(780px 560px at 102% 4%,rgba(94,234,212,.34),transparent 58%),radial-gradient(900px 700px at 55% 118%,rgba(251,146,200,.30),transparent 62%),#f4f2fc;
}
:root[data-theme="obsidian"]{
  --font-display:'Fraunces',Georgia,serif;
  --bg:#09090b;--panel:#101013;--raised:#16161a;--side-item:rgba(255,255,255,.025);--side-active:#1b1b20;
  --ink:#f3eee4;--ink-dim:#a8a193;--ink-faint:#6d685d;--line:rgba(222,186,110,.15);
  --accent:#d8b160;--accent-ink:#16110a;--accent-soft:rgba(216,177,96,.10);--ok:#7fbf8a;--err:#e5826a;
  --glass:#0d0d10;--grid:transparent;
  --shadow:0 24px 60px -24px rgba(0,0,0,.9);
  --accent-grad:linear-gradient(135deg,#f3d791 0%,#d3a547 55%,#b3812f 100%);
  --btn-shadow:0 6px 18px -8px rgba(216,177,96,.6);--mark-shadow:0 0 0 1px rgba(243,215,145,.45);
  --user-bg:#18181d;--user-line:rgba(216,177,96,.30);
  --ico-bg:#f1ede4;--ico-line:rgba(216,177,96,.4);
  --bg-img:radial-gradient(1100px 620px at 50% -25%,rgba(216,177,96,.13),transparent 62%),radial-gradient(700px 500px at 100% 110%,rgba(120,90,40,.12),transparent 60%),#09090b;
}
:root[data-theme="neon"]{
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --bg:#04060c;--panel:#080c1a;--raised:#0d1328;--side-item:rgba(34,211,238,.035);--side-active:#0e1a33;
  --ink:#e8f2ff;--ink-dim:#8ea4c8;--ink-faint:#51658d;--line:rgba(56,189,248,.20);
  --accent:#22d3ee;--accent-ink:#021019;--accent-soft:rgba(34,211,238,.10);--ok:#34f0b0;--err:#ff5d86;
  --glass:rgba(6,10,24,.86);--grid:transparent;
  --shadow:0 0 0 1px rgba(34,211,238,.12),0 24px 70px -30px rgba(34,211,238,.5);
  --accent-grad:linear-gradient(135deg,#22d3ee 0%,#6d7cff 52%,#e879f9 100%);
  --btn-shadow:0 0 22px -4px rgba(34,211,238,.65);--mark-shadow:0 0 18px rgba(34,211,238,.65);
  --user-bg:linear-gradient(135deg,rgba(34,211,238,.12),rgba(232,121,249,.10));--user-line:rgba(34,211,238,.38);
  --ico-bg:#eaf6ff;--ico-line:rgba(34,211,238,.55);
  --bg-img:linear-gradient(rgba(56,189,248,.055) 1px,transparent 1px) 0 0/46px 46px,linear-gradient(90deg,rgba(56,189,248,.055) 1px,transparent 1px) 0 0/46px 46px,radial-gradient(900px 600px at 10% -10%,rgba(34,211,238,.17),transparent 60%),radial-gradient(800px 560px at 100% 100%,rgba(232,121,249,.15),transparent 60%),#04060c;
}
*,*::before,*::after{box-sizing:inherit;}
html,body{height:100%;margin:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{background:radial-gradient(circle at 1px 1px,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
button{font-family:inherit;color:inherit;}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.app{display:flex;height:100%;padding:10px;gap:10px;}

/* sidebar */
.side{width:250px;flex:none;display:flex;flex-direction:column;gap:10px;z-index:40;min-height:0;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 6px 2px;}
.mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:17px;flex:none;}
.brand h1{font-family:'Fraunces',serif;font-weight:500;font-size:21px;margin:0;line-height:1;}
.brand .ver{font-size:10.5px;color:var(--ink-dim);display:block;margin-top:3px;}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:var(--r-m);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:border-color .15s,transform .1s,filter .15s;}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
.btn-primary:hover{filter:brightness(1.07);}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:var(--r-s);}
.btn-danger:hover{border-color:var(--err);color:var(--err);}
.wide{width:100%;}
.icon-btn{width:34px;height:34px;border-radius:var(--r-m);border:1px solid transparent;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-dim);flex:none;}
.icon-btn:hover{background:var(--raised);color:var(--ink);border-color:var(--line);}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.side-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim);padding:2px 8px;letter-spacing:.05em;font-weight:600;}
.nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px;}
.mitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:var(--side-item);padding:9px 10px;border-radius:12px;cursor:pointer;font-size:13.5px;}
.mitem:hover{background:var(--side-active);}
.mitem.active{background:var(--side-active);box-shadow:0 2px 10px rgba(20,50,80,.12);border-color:var(--line);font-weight:600;}
.av{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;flex:none;letter-spacing:.02em;}
.mitem .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;}}
.side-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 0;}
.theme-row{display:flex;gap:6px;padding:3px;background:var(--side-item);border:1px solid var(--line);border-radius:999px;}
.theme-dot{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;}
.theme-dot[data-t=harbor]{background:#a8cde3}.theme-dot[data-t=graphite]{background:#181b20}.theme-dot[data-t=signal]{background:#07080a}
.theme-dot::after{content:'';width:8px;height:8px;border-radius:50%;background:#2f6fed;}
.theme-dot[data-t=graphite]::after{background:#c9a227}.theme-dot[data-t=signal]::after{background:#ffb63d}
.theme-dot.active{outline:2px solid var(--accent);outline-offset:2px;}

/* main card */
.main{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);}
.mhead{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.mhead .ttl{min-width:0;}
.mhead .ttl b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mhead .ttl span{font-size:11px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.caps{display:flex;gap:5px;flex-wrap:wrap;}
.cap{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.cap.y{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line));}
.hspace{flex:1;}
.hctl{display:flex;align-items:center;gap:6px;}
.hctl select{width:auto;max-width:180px;padding:6px 8px;font-size:12px;}
input[type=text],input[type=password],input[type=search],textarea,select{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-s);padding:8px 10px;font-size:13px;width:100%;font-family:inherit;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;}
#sideToggle{display:none;}
.notice{margin:12px 16px 0;padding:10px 13px;border-radius:var(--r-m);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.notice[hidden]{display:none;}
.msgs{flex:1;overflow-y:auto;padding:18px 18px 6px;display:flex;flex-direction:column;gap:20px;}
.turn{display:flex;flex-direction:column;gap:12px;max-width:860px;width:100%;margin:0 auto;}
.u{align-self:flex-end;max-width:88%;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));padding:9px 13px;border-radius:14px 14px 3px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);background:var(--panel);display:inline-flex;align-items:center;gap:5px;max-width:210px;}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip .x{cursor:pointer;border:none;background:none;color:var(--ink-faint);padding:0;font-size:13px;line-height:1;}
.chip .x:hover{color:var(--err);}
.chip img{width:18px;height:18px;object-fit:cover;border-radius:3px;}
.a{display:flex;gap:11px;align-items:flex-start;}
.a .ab{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
.md{font-size:14.5px;line-height:1.65;overflow-wrap:anywhere;}
.md p{margin:0 0 .75em;}.md p:last-child{margin-bottom:0;}
.md h1,.md h2,.md h3,.md h4{font-family:'Fraunces',serif;font-weight:600;margin:.9em 0 .4em;line-height:1.25;}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3,.md h4{font-size:1.06em}
.md ul,.md ol{margin:.2em 0 .8em;padding-left:1.4em;}
.md li{margin:.18em 0;}
.md code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:var(--raised);border:1px solid var(--line);padding:1px 5px;border-radius:4px;}
.md pre{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;overflow-x:auto;margin:.7em 0;}
.md pre code{background:none;border:none;padding:0;font-size:12.5px;line-height:1.55;}
.md blockquote{margin:.6em 0;padding:2px 13px;border-left:3px solid var(--accent);color:var(--ink-dim);}
.md a{color:var(--accent);text-decoration:underline;}
.md table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;margin:.6em 0;}
.md th,.md td{border:1px solid var(--line);padding:5px 10px;text-align:left;}
.md th{background:var(--raised);}
.err-box{border:1px solid color-mix(in srgb,var(--err) 55%,var(--line));background:color-mix(in srgb,var(--err) 8%,var(--panel));border-radius:var(--r-m);padding:10px 12px;font-size:12.5px;color:var(--err);line-height:1.5;overflow-wrap:anywhere;}
.err-box .hint{display:block;color:var(--ink-dim);margin-top:5px;}
.loading{display:flex;align-items:center;gap:9px;color:var(--ink-faint);font-size:13px;padding-top:4px;}
.imgs{display:flex;flex-wrap:wrap;gap:10px;}
.imgs figure{margin:0;position:relative;max-width:100%;}
.imgs img{max-width:100%;max-height:420px;border-radius:var(--r-m);border:1px solid var(--line);display:block;background:var(--raised);}
.imgs figcaption{font-size:11px;color:var(--ink-faint);margin-top:4px;max-width:520px;}
.imgs .dl{position:absolute;top:8px;right:8px;opacity:0;transition:opacity .15s;}
.imgs figure:hover .dl,.imgs figure:focus-within .dl{opacity:1;}
@media (hover:none){.imgs .dl{opacity:1;}}
.tag{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.tag.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:11px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.meta .sp{flex:1;}
.mini{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:11.5px;padding:2px 4px;font-family:inherit;}
.mini:hover{color:var(--accent);}.mini.starred{color:var(--accent);}
.welcome{margin:auto;text-align:center;max-width:520px;color:var(--ink-dim);line-height:1.6;padding:20px;}
.welcome .av{width:52px;height:52px;border-radius:16px;font-size:18px;margin-bottom:12px;}
.welcome h2{font-family:'Fraunces',serif;font-weight:500;font-size:26px;margin:0 0 6px;color:var(--ink);}
.sugs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
.sug{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--ink-dim);}
.sug:hover{border-color:var(--accent);color:var(--ink);}

/* composer */
.dock{padding:6px 16px 14px;display:flex;justify-content:center;}
.composer{width:min(820px,100%);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-l);padding:9px 12px;}
.composer.drag{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);}
.pending{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;}
.pending:empty{display:none;}
.link-pop{display:flex;gap:6px;margin-bottom:7px;}
.link-pop[hidden]{display:none;}
.composer textarea{border:none;background:transparent;resize:none;min-height:44px;max-height:180px;padding:4px;font-size:14.5px;line-height:1.5;}
.composer textarea:focus{outline:none;}
.comp-row{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap;}
.grow{flex:1;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel);}
.seg button{border:none;background:transparent;font-size:11.5px;padding:4px 11px;border-radius:999px;cursor:pointer;color:var(--ink-dim);}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600;}
.send-meta{font-size:11px;color:var(--ink-faint);}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,15,25,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:18px;}
.modal.open{display:flex;}
.sheet{width:min(860px,100%);max-height:calc(100vh - 36px);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-l);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden;}
:root[data-theme="harbor"] .sheet{background:#eef5fa;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
.sheet-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:21px;margin:0;}
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-dim);border-bottom:2px solid transparent;font-size:13px;}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600;}
.sheet-body{padding:16px 18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;display:flex;flex-direction:column;gap:10px;}
.card h3{margin:0;font-size:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.lbl{font-size:11px;color:var(--ink-faint);margin-bottom:3px;display:block;}
.keyrow{display:flex;gap:6px;}
.note{font-size:12px;color:var(--ink-dim);line-height:1.55;}.note b{color:var(--ink);}
.out{font-size:11.5px;font-family:'JetBrains Mono',monospace;color:var(--ink-dim);overflow-wrap:anywhere;}
.out.ok{color:var(--ok);}.out.bad{color:var(--err);}
.out img{max-width:160px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:6px;}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-dim);cursor:pointer;}
.chk input{width:auto;accent-color:var(--accent);}
.switch{position:relative;width:36px;height:21px;flex:none;}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2;width:100%;height:100%;}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s;}
.switch span::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s;}
.switch input:checked + span{background:var(--accent);}
.switch input:checked + span::after{transform:translateX(15px);}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px;}
.mrow{display:grid;grid-template-columns:auto auto 1fr 1.3fr auto;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);}

/* ================= v6 premium layer ================= */
body{background:var(--bg-img);background-attachment:fixed;}
.brand h1,.title-input,.welcome h2,.sheet-head h2,.consensus .chead b,.onboard h2,.md h1,.md h2,.md h3,.md h4{font-family:var(--font-display);}
.mark{background:var(--accent-grad);box-shadow:var(--mark-shadow);}

.btn{transition:border-color .15s,transform .12s,box-shadow .2s,filter .15s,background .15s;}

.u{background:var(--user-bg);border-color:var(--user-line);}
.seg button.on,.viewseg button.on{background:var(--accent-grad);color:var(--accent-ink);box-shadow:var(--btn-shadow);}

.mitem.active,.cv.active{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent),var(--shadow);}

<script>
(function(){"use strict";
/* ============================ utils ============================ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>(n==null||isNaN(n))?"–":Number(n).toLocaleString("en-US");
const b64=du=>du.slice(du.indexOf(",")+1);
let toastT=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}

const LS={
  get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const DB=(()=>{
  let dbp=null;const mem=new Map();
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      try{const r=indexedDB.open("ai-arena-v4",1);
        r.onupgradeneeded=()=>r.result.createObjectStore("kv");
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}
    });
    return dbp;
  }
  async function get(k){
    try{const db=await open();
      return await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
    }catch(e){return mem.get(k);}
  }
  async function set(k,v){
    mem.set(k,v);
    try{const db=await open();
      await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});
    }catch(e){}
  }
  async function del(k){
    mem.delete(k);
    try{const db=await open();
      await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});
    }catch(e){}
  }
  return {get,set,del};
})();

/* ============================ markdown ============================ */
function md(src){
  src=String(src||"").replace(/\r\n/g,"\n");
  const blocks=[];
  src=src.replace(/```[\w+-]*\n([\s\S]*?)(```|$)/g,(_,code)=>{blocks.push("<pre><code>"+esc(code.replace(/\n$/,""))+"</code></pre>");return "\u0000B"+(blocks.length-1)+"\u0000";});
  const inline=s=>{
    s=esc(s);
    s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
    s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    s=s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
    return s;
  };
  const lines=src.split("\n");const out=[];let i=0;
  const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l)&&l.includes("-");
  while(i<lines.length){
    let l=lines[i];
    if(!l.trim()){i++;continue;}
    let mt;
    if((mt=/^\u0000B(\d+)\u0000$/.exec(l.trim()))){out.push(blocks[+mt[1]]);i++;continue;}
    if((mt=/^(#{1,4})\s+(.*)$/.exec(l))){const n=Math.min(mt[1].length,4);out.push("<h"+n+">"+inline(mt[2])+"</h"+n+">");i++;continue;}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out.push("<hr>");i++;continue;}
    if(l.includes("|")&&i+1<lines.length&&isSep(lines[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
      let h="<table><thead><tr>"+cells(l).map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>";
      i+=2;
      while(i<lines.length&&lines[i].includes("|")&&lines[i].trim()){h+="<tr>"+cells(lines[i]).map(c=>"<td>"+c+"</td>").join("")+"</tr>";i++;}
      out.push(h+"</tbody></table>");continue;
    }
    if(/^\s*>\s?/.test(l)){const q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,""));i++;}out.push("<blockquote>"+inline(q.join(" "))+"</blockquote>");continue;}
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){
      const ord=/^\s*\d+[.)]\s+/.test(l);const items=[];
      while(i<lines.length&&/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){items.push("<li>"+inline(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/,""))+"</li>");i++;}
      out.push((ord?"<ol>":"<ul>")+items.join("")+(ord?"</ol>":"</ul>"));continue;
    }
    const p=[];
    while(i<lines.length&&lines[i].trim()&&!/^(#{1,4}\s|\s*([-*+]|\d+[.)])\s+|\s*>|\u0000B)/.test(lines[i])&&!(lines[i].includes("|")&&i+1<lines.length&&isSep(lines[i+1]))){p.push(lines[i]);i++;}
    if(p.length)out.push("<p>"+inline(p.join("\n")).replace(/\n/g,"<br>")+"</p>");else i++;
  }
  return out.join("");
}

/* ============================ helpers: files ============================ */
let dl=null;
function dataUrlToBlob(du){
  const i=du.indexOf(",");const mime=du.slice(5,du.indexOf(";"));
  const bin=atob(du.slice(i+1));const arr=new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);
  return new Blob([arr],{type:mime});
}
async function saveFile(filename,data){
  if(dl){
    try{await dl.save({filename,data});return true;}
    catch(e){if(e&&e.code==="declined")return false;}
  }
  try{
    const blob=(typeof Blob!=="undefined"&&data instanceof Blob)?data:new Blob([data],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);return true;
  }catch(e){}
  if(typeof data==="string"){
    try{await navigator.clipboard.writeText(data);toast("Couldn't start a download — copied to the clipboard instead.");}
    catch(e){toast("Downloads aren't available in this view.");}
  }else toast("Downloads aren't available here — right-click the image to save it.");
  return false;
}
const safeName=s=>(String(s||"chat").replace(/[^\w\- ]+/g,"").trim().slice(0,50)||"chat").replace(/\s+/g,"-");
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return u.slice(0,30);}};

const pend={atts:[],links:[]};
function readDataUrl(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(f);});}
function shrinkImage(f){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const raw=fr.result;
      if(f.size<900*1024&&/image\/(png|jpe?g|webp|gif)/.test(f.type))return res(raw);
      const im=new Image();
      im.onload=()=>{
        const sc=Math.min(1,1600/Math.max(im.width,im.height));
        const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));
        const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg",.86));
      };
      im.onerror=()=>res(raw);im.src=raw;
    };
    fr.onerror=()=>res("");fr.readAsDataURL(f);
  });
}
let pdfjsP=null;
function loadPdfjs(){
  if(pdfjsP)return pdfjsP;
  pdfjsP=new Promise((res,rej)=>{
    if(window.pdfjsLib)return res(window.pdfjsLib);
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib);}catch(e){rej(e);}};
    s.onerror=()=>rej(new Error("pdf.js failed to load"));
    document.head.appendChild(s);
  });
  return pdfjsP;
}
async function extractPdf(a,file){
  try{
    const lib=await loadPdfjs();
    const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
    let out="";const n=Math.min(doc.numPages,80);
    for(let p=1;p<=n;p++){
      const pg=await doc.getPage(p);const tc=await pg.getTextContent();
      out+="\n--- page "+p+" ---\n"+tc.items.map(x=>x.str).join(" ");
      if(out.length>150000)break;
    }
    a.text=out.trim();a.pages=doc.numPages;a.ex=a.text.replace(/---\s*page \d+\s*---/g,"").trim().length>40?"ok":"empty";
    if(a.ex==="empty")a.text="";
  }catch(e){a.ex="fail";}
  renderPending();
}
async function addFiles(files){
  for(const f of files){
    try{
      if(f.type.startsWith("image/")){
        const du=await shrinkImage(f);if(!du){toast("Couldn't read "+f.name);continue;}
        pend.atts.push({id:uid(),kind:"image",name:f.name||"image",mime:du.slice(5,du.indexOf(";")),dataUrl:du});
      }else if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){
        if(f.size>20*1024*1024){toast(f.name+" is over 20 MB — skipped.");continue;}
        const a={id:uid(),kind:"pdf",name:f.name,mime:"application/pdf",dataUrl:await readDataUrl(f),text:"",pages:0,ex:"pending"};
        pend.atts.push(a);extractPdf(a,f);
      }else if(/^text\//.test(f.type)||/\.(txt|md|csv|json)$/i.test(f.name)){

function blobToDataUrl(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b);});}
async function inlineRemote(url){
  try{const r=await nfetch(url);if(!r.ok)throw new Error("x");return await blobToDataUrl(await r.blob());}
  catch(e){return url;}
}
function imagesFromMessage(msg){
  const imgs=((msg&&msg.images)||[]).map(i=>(i.image_url&&i.image_url.url)||i.url).filter(Boolean);
  const text=msg&&typeof msg.content==="string"?msg.content:"";
  if(!imgs.length&&text){
    const re=/!\[[^\]]*\]\((data:image[^)]+|https?:[^)\s]+)\)/g;let m;
    while((m=re.exec(text)))imgs.push(m[1]);
  }
  return {imgs,text:text.replace(/!\[[^\]]*\]\([^)]*\)/g,"").trim()};
}
/* sp = {type:'openai'|'chatmod'|'gemini'|'dashscope'|'mistral', base, key, model, fmt, path, chatPath, agentId, setAgent}
   needs: postJSON(url,headers,body,signal), mkErr, normUsage */
async function imgGenerate(sp,prompt,signal){
  const t0=performance.now(),B=String(sp.base||"").replace(/\/+$/,""),K=String(sp.key||"").trim();
  const bearer={"Content-Type":"application/json","Authorization":"Bearer "+K};
  const fin=(imgs,text,usage)=>({imgs,text:text||"",usage:usage||null,ms:performance.now()-t0});
  if(sp.type==="openai"){
    const body={model:sp.model,prompt,n:1};if(sp.fmt)body.response_format="b64_json";
    const d=await postJSON(B+(sp.path||"/images/generations"),bearer,body,signal);
    const it=d.data&&d.data[0];if(!it)throw mkErr("The image endpoint returned no image.","empty");
    let src=it.b64_json?("data:image/png;base64,"+it.b64_json):it.url;
    if(!src)throw mkErr("The image endpoint returned no image data.","empty");
    if(!src.startsWith("data:"))src=await inlineRemote(src);
    const u=d.usage;
    return fin([{src,type:"gen",model:sp.model}],it.revised_prompt,u?normUsage({inp:u.input_tokens,out:u.output_tokens,total:u.total_tokens}):null);
  }
  if(sp.type==="chatmod"){
    const d=await postJSON(B+(sp.chatPath||"/chat/completions"),bearer,{model:sp.model,messages:[{role:"user",content:prompt}],modalities:["image","text"]},signal);
    const got=imagesFromMessage(d.choices&&d.choices[0]&&d.choices[0].message);
    if(!got.imgs.length)throw mkErr(got.text?"No image came back — the model said: "+got.text.slice(0,200):"No image came back from this model.","empty");
    const u=d.usage;
    return fin(got.imgs.map(src=>({src,type:"gen",model:sp.model})),got.text,u?normUsage({inp:u.prompt_tokens,out:u.completion_tokens,total:u.total_tokens}):null);
  }
  if(sp.type==="gemini"){
    const url=B+"/models/"+encodeURIComponent(sp.model)+":generateContent?key="+encodeURIComponent(K);
    const d=await postJSON(url,{"Content-Type":"application/json"},{contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{responseModalities:["TEXT","IMAGE"]}},signal);
    const parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
    const imgs=parts.filter(p=>p.inlineData&&p.inlineData.data).map(p=>({src:"data:"+(p.inlineData.mimeType||"image/png")+";base64,"+p.inlineData.data,type:"gen",model:sp.model}));
    const text=parts.filter(p=>p.text&&!p.thought).map(p=>p.text).join("");
    if(!imgs.length)throw mkErr(text?"The model replied with text instead of an image: "+text.slice(0,200):"The image model returned no image.","empty");
    const um=d.usageMetadata;
    return fin(imgs,text,um?normUsage({inp:um.promptTokenCount,out:um.candidatesTokenCount,total:um.totalTokenCount}):null);
  }
  if(sp.type==="dashscope"){
    let origin;try{origin=new URL(B).origin;}catch(e){throw mkErr("The Qwen base URL is not valid.","nokey");}
    const d=await postJSON(origin+"/api/v1/services/aigc/multimodal-generation/generation",bearer,
      {model:sp.model,input:{messages:[{role:"user",content:[{text:prompt}]}]},parameters:{watermark:false}},signal);
    const content=(d.output&&d.output.choices&&d.output.choices[0]&&d.output.choices[0].message&&d.output.choices[0].message.content)||[];
    const urls=content.map(c=>c&&c.image).filter(Boolean);
    if(!urls.length)throw mkErr("Qwen returned no image"+(d.message?": "+d.message:"."),"empty");
    const imgs=[];for(const u of urls)imgs.push({src:await inlineRemote(u),type:"gen",model:sp.model});
    return fin(imgs,"",null);
  }
  if(sp.type==="mistral"){
    let agent=sp.agentId;
    if(!agent){
      const a=await postJSON(B+"/agents",bearer,{model:sp.model||"mistral-medium-latest",name:"Image generation agent",description:"Generates images on request",instructions:"Use the image generation tool whenever the user asks for an image.",tools:[{type:"image_generation"}]},signal);
      agent=a.id;if(!agent)throw mkErr("Mistral did not return an agent id.","empty");
      if(sp.setAgent)sp.setAgent(agent);
    }
    let d;
    try{d=await postJSON(B+"/conversations",bearer,{agent_id:agent,inputs:prompt,stream:false,store:false},signal);}
    catch(e){if(e.status===404&&sp.setAgent)sp.setAgent("");throw e;}
    const ids=[];let text="";
    (d.outputs||[]).forEach(o=>{
      const cs=Array.isArray(o.content)?o.content:(typeof o.content==="string"?[{type:"text",text:o.content}]:[]);
      cs.forEach(c=>{if(c&&c.type==="tool_file"&&c.file_id)ids.push(c.file_id);else if(c&&c.type==="text"&&c.text)text+=c.text;});
    });
    if(!ids.length)throw mkErr("Mistral did not return an image file"+(text?" — it said: "+text.slice(0,160):"."),"empty");
    const imgs=[];
    for(const id of ids){
      let r;try{r=await nfetch(B+"/files/"+id+"/content",{headers:{"Authorization":"Bearer "+K},signal});}
      catch(e){throw mkErr("Couldn't download the generated file (blocked by the browser).","cors");}
      if(!r.ok)throw mkErr("Couldn't download the generated file (HTTP "+r.status+").","http",r.status);
      imgs.push({src:await blobToDataUrl(await r.blob()),type:"gen",model:"mistral image tool"});
    }
    return fin(imgs,text,null);
  }
  throw mkErr("Unknown image method.","empty");
}

const sleepMs=(ms,signal)=>new Promise((res,rej)=>{
  const t=setTimeout(res,ms);
  if(signal)signal.addEventListener("abort",()=>{clearTimeout(t);rej(mkErr(signal.reason==="timeout"?"Request timed out.":"Stopped.","abort"));},{once:true});
});
async function getJSON(url,headers,signal){
  let res;
  try{res=await nfetch(url,{headers,signal});}
  catch(e){
    if(signal&&signal.aborted)throw mkErr("Stopped.","abort");
    throw mkErr("The request was blocked or could not reach the server.","cors");
  }
  const txt=await res.text();let d;
  try{d=txt?JSON.parse(txt):{};}catch(e){d={raw:txt.slice(0,300)};}
  if(!res.ok)throw mkErr(apiErrMsg(res,d),"http",res.status);
  return d;
}
/* sp = {type:'sora'|'veo', base, key, model, path, seconds}  — both are asynchronous jobs: submit → poll → download */
async function videoGenerate(sp,prompt,signal,onStatus){
  const t0=performance.now(),B=String(sp.base||"").replace(/\/+$/,""),K=String(sp.key||"").trim();
  const st=t=>{try{onStatus&&onStatus(t);}catch(e){}};
  const limit=Date.now()+15*60*1000;
  if(sp.type==="sora"){
    const path=sp.path||"/videos";
    const hdr={"Content-Type":"application/json","Authorization":"Bearer "+K};
    const body={model:sp.model,prompt};if(sp.seconds)body.seconds=String(sp.seconds);
    st("submitting…");
    let job=await postJSON(B+path,hdr,body,signal);
    const id=job.id||job.video_id||(job.data&&job.data.id);
    if(!id)throw mkErr("The video API did not return a job id.","empty");
    while(job.status!=="completed"){
      if(job.status==="failed"||job.status==="cancelled"||job.status==="error")throw mkErr("Video generation failed"+(job.error?": "+(job.error.message||JSON.stringify(job.error)):".")+"","http",0);
      if(Date.now()>limit)throw mkErr("Video generation took longer than 15 minutes.","abort");
      st((job.status||"working")+(job.progress!=null?" · "+Math.round(job.progress)+"%":"")+"…");
      await sleepMs(4000,signal);
      job=await getJSON(B+path+"/"+id,{"Authorization":"Bearer "+K},signal);
    }
    st("downloading…");
    let r;
    try{r=await nfetch(B+path+"/"+id+"/content",{headers:{"Authorization":"Bearer "+K},signal});}
    catch(e){throw mkErr("Couldn't download the finished video (blocked by the browser).","cors");}
    if(!r.ok)throw mkErr("Couldn't download the finished video (HTTP "+r.status+").","http",r.status);
    const blob=await r.blob();
    return {vids:[{blob:blob.type&&blob.type.indexOf("video")===0?blob:new Blob([blob],{type:"video/mp4"}),model:sp.model}],usage:null,ms:performance.now()-t0};
  }
  if(sp.type==="veo"){
    st("submitting…");
    const op=await postJSON(B+"/models/"+encodeURIComponent(sp.model)+":predictLongRunning?key="+encodeURIComponent(K),{"Content-Type":"application/json"},{instances:[{prompt}]},signal);
    const name=op.name;if(!name)throw mkErr("Veo did not return an operation name.","empty");
    let cur=op;
    while(!cur.done){
      if(Date.now()>limit)throw mkErr("Video generation took longer than 15 minutes.","abort");
      st("rendering…");
      await sleepMs(6000,signal);
      cur=await getJSON(B+"/"+name+"?key="+encodeURIComponent(K),{},signal);
    }
    if(cur.error)throw mkErr("Veo failed: "+(cur.error.message||JSON.stringify(cur.error)),"http",cur.error.code||0);
    const gv=cur.response&&(cur.response.generateVideoResponse||cur.response);
    const smp=gv&&gv.generatedSamples&&gv.generatedSamples[0];
    const uri=smp&&smp.video&&smp.video.uri;
    if(!uri){
      const why=gv&&gv.raiMediaFilteredReasons&&gv.raiMediaFilteredReasons[0];
      throw mkErr(why?"Veo blocked this prompt: "+why:"Veo finished but returned no video.","empty");
    }
    st("downloading…");
    let r;
    try{r=await nfetch(uri+(uri.indexOf("?")>=0?"&":"?")+"key="+encodeURIComponent(K),{signal});}
    catch(e){throw mkErr("Couldn't download the finished video (blocked by the browser).","cors");}
    if(!r.ok)throw mkErr("Couldn't download the finished video (HTTP "+r.status+").","http",r.status);
    const blob=await r.blob();
    return {vids:[{blob:blob.type&&blob.type.indexOf("video")===0?blob:new Blob([blob],{type:"video/mp4"}),model:sp.model}],usage:null,ms:performance.now()-t0};
  }
  throw mkErr("Unknown video method.","empty");
}

function detectIntent(turn){

  if(/\b(solve|equation|integral|derivative|probability|theorem|prove|calculate|math|algebra|geometry|statistics|puzzle|logic|reasoning)\b|\d\s*[+\-*\/^]\s*\d/.test(t))return "math";
  if(/\b(story|poem|lyrics|essay|creative|write a|slogan|caption|rewrite|blog|email|letter|narrative|screenplay)\b/.test(t))return "creative";
  if(/\b(latest|news|today|current|price|weather|who is|who won|trending|stock|score|release date|cite|sources?)\b|\b20[2-3]\d\b/.test(t))return "facts";
  if(/\b(translate|translation|hindi|spanish|french|german|japanese|chinese|arabic)\b/.test(t))return "lang";

      turn.consensus.status="streaming";turn.consensus.text=txt;queueConsPaint(sess,turn);
    });
    turn.consensus={status:"done",by:sm.id,auto,why:pick?pick.why:"",text:res.text,usage:res.usage,ms:res.ms,n:items.length};
  }catch(e){

const NAME_FIX={deepseek:"DeepSeek",openai:"OpenAI",glm:"GLM",kimi:"Kimi",qwen:"Qwen",grok:"Grok",gemini:"Gemini",claude:"Claude",mistral:"Mistral",llama:"Llama",sonar:"Sonar",command:"Command"};
function verOf(id){const m=id.replace(/\d{4}-\d{2}-\d{2}|\d{8}/g,"").match(/(\d+(?:[.\-]\d+)?)/);return m?parseFloat(m[1].replace("-",".")):0;}
function prettyName(id){
  let s=id.split("/").pop().replace(/:.*$/,"").replace(/-(\d{4}-\d{2}-\d{2}|\d{8}|latest|preview.*)$/i,"");
  const out=s.split(/[-_]/).map(p=>NAME_FIX[p.toLowerCase()]||(/^\d/.test(p)?p:(p.toLowerCase()==="gpt"?"GPT":p.charAt(0).toUpperCase()+p.slice(1)))).join(" ");
  return out.replace(/^GPT (\d)/,"GPT-$1");
}
function normList(d){
  const arr=(d&&(d.data||d.models))||[];
  return arr.map(x=>{
    const id=x.id||x.name||x.model,a=x.architecture||{},inp=a.input_modalities||x.input_modalities||[],outp=a.output_modalities||x.output_modalities||[];
    return {id,created:x.created||x.created_at||0,vision:inp.includes("image"),imgOut:outp.includes("image"),vidOut:outp.includes("video")};

function pickPopular(list,limit){
  const good=list.filter(x=>x.id&&!JUNK.test(x.id)),by={};
  for(const x of good){
    let fam=null;for(const [f,re] of FAMS)if(re.test(x.id.toLowerCase())){fam=f;break;}
    if(!fam)continue;
    x.fam=fam;x.dated=/\d{4}-\d{2}-\d{2}|\d{8}/.test(x.id)?1:0;x.ver=verOf(x.id);(by[fam]=by[fam]||[]).push(x);
  }
  const out=[];
  for(const arr of Object.values(by)){
    arr.sort((a,b)=>(b.created||0)-(a.created||0)||b.ver-a.ver||a.dated-b.dated||a.id.length-b.id.length);
    const seen=new Set();let n=0;
    for(const x of arr){const nm=prettyName(x.id);if(seen.has(nm))continue;seen.add(nm);x.name=nm;x.pre=n<2;out.push(x);if(++n>=4)break;}
  }
  if(!out.length)return good.slice(0,limit).map((x,i)=>Object.assign({},x,{name:prettyName(x.id),pre:i<12,fam:"other"}));

function exportMd(sess){
  if(!sess.turns.length){toast("Nothing to export yet.");return;}
  let o="# "+sess.title+"\n\n_Exported from NEXUS · "+new Date().toLocaleString()+"_\n\n";
  for(const t of sess.turns){
    o+="## Prompt\n\n"+t.text+"\n\n";
    if(t.atts&&t.atts.length)o+="_Attachments: "+t.atts.map(a=>a.name).join(", ")+"_\n\n";
    if(t.links&&t.links.length)o+=t.links.map(l=>"- "+l).join("\n")+"\n\n";
    for(const [mid,r] of Object.entries(t.replies)){
      const m=modelById(mid);if(!m)continue;
      o+="### "+m.label+(r.star?" ★":"")+"\n\n";
      if(r.status==="error"){o+="> Error: "+r.err+"\n\n";continue;}
      if(r.imgs&&r.imgs.length)o+="_["+r.imgs.length+" image(s) generated"+(r.imagePrompt?": "+r.imagePrompt:"")+"]_\n\n";
      if(r.text)o+=r.text+"\n\n";
      o+="<sub>"+usageStr(r.usage,r.ms).join(" · ")+"</sub>\n\n";
    }
    if(t.consensus&&t.consensus.status==="done")o+="### ✦ Consensus\n\n"+t.consensus.text+"\n\n";
  }
  saveFile(safeName(sess.title)+".md",o);
}

function arm(btn,label,fn){
  if(btn.dataset.armed){fn();return;}
  btn.dataset.armed="1";const old=btn.textContent;btn.textContent=label;
  setTimeout(()=>{delete btn.dataset.armed;btn.textContent=old;},3000);
}
async function fetchIds(connId){
  const out=$("#fetchOut"),c=connById(connId);out.textContent="Fetching…";
  try{
    if(!c.base.trim())throw new Error("set the base URL first");
    const res=await nfetch(B(c)+(pathOf(c.modelsPath)||"/models"),{headers:c.key.trim()?{"Authorization":"Bearer "+c.key.trim()}:{}});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const d=await res.json();
    idList=(d.data||d.models||[]).map(x=>x.id||x.name||x.model).filter(Boolean).sort();
    $("#idlist").innerHTML=idList.map(i=>'<option value="'+esc(i)+'">').join("");
    out.textContent=idList.length?idList.length+" IDs loaded from "+c.name+" — they autocomplete in the ID boxes.":"The gateway returned an empty list.";
  }catch(e){out.textContent="Couldn't fetch the list ("+e.message+"). You can still type model IDs by hand.";}
}

/* ============================ nexus: events ============================ */
function onAct(e){
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  if(act==="openset"){openSettings("conns");return;}
  if(act==="sidetoggle"){$("#side").classList.add("open");$("#scrim").classList.add("show");return;}
  if(act==="sug"){$("#prompt").value=b.textContent;autosize();$("#prompt").focus();return;}
  if(act==="gocompare"){setView("compare");return;}
  const s=activeSess();if(!s)return;
  const t=b.dataset.ti?s.turns.find(x=>x.id===b.dataset.ti):null,mid=b.dataset.mid,r=t&&mid?t.replies[mid]:null,m=mid?modelById(mid):null;
  if(act==="cmpchip"){
    const i=s.models.indexOf(mid);
    if(i>=0)s.models.splice(i,1);else if(cmpSel(s).length<MAX_CMP)s.models.push(mid);else{toast("You can compare up to "+MAX_CMP+" models.");return;}
    persist();renderNav();renderHead();renderCompare(false);updateSend();
  }else if(act==="cmprm"){
    s.models=s.models.filter(x=>x!==mid);persist();renderNav();renderHead();renderCompare(false);updateSend();
  }else if(act==="consensus"||act==="cons-regen"){
    const last=lastMulti(s);if(!last)return;
    const sel=$("#synthSel");const synth=(sel&&sel.value)||S.synth||"auto";
    S.synth=synth;saveS();makeConsensus(s,last,synth);
  }else if(act==="cons-copy"){
    const last=lastMulti(s);
    if(last&&last.consensus)navigator.clipboard.writeText(last.consensus.text||"").then(()=>toast("Copied"),()=>toast("Copy isn't allowed in this view."));
  }else if(act==="cons-toggle"){S.consCollapsed=!S.consCollapsed;if(S.consCollapsed)S.consMax=false;saveS();renderCompare(false);
  }else if(act==="cons-max"){S.consMax=!S.consMax;if(S.consMax)S.consCollapsed=false;saveS();renderCompare(false);
  }else if(act==="winmin"){
    s.min=s.min||[];const i=s.min.indexOf(mid);if(i>=0)s.min.splice(i,1);else{s.min.push(mid);if(s.max===mid)s.max=null;}
    persist();renderCompare(false);
  }else if(act==="winmax"){
    s.max=s.max===mid?null:mid;if(s.max)s.min=(s.min||[]).filter(x=>x!==mid);persist();renderCompare(false);
  }else if(act==="showall"){s.max=null;persist();renderCompare(false);}
  else if(act==="collapseall"){s.min=cmpSel(s).slice();persist();renderCompare(false);}
  else if(act==="expandall"){s.min=[];s.max=null;persist();renderCompare(false);}
  else if(act==="sync"){S.sync=!S.sync;saveS();renderCompare(false);}
  else if(act==="lane"){S.lane=b.dataset.l;saveS();renderCompare(false);}
  else if(act==="cmpall"){const set=new Set(s.models);for(const m of enabled()){if(set.size>=MAX_CMP)break;set.add(m.id);}s.models=Array.from(set);persist();renderNav();renderHead();renderCompare(false);updateSend();}
  else if(act==="cmpnone"){s.models=[];persist();renderNav();renderHead();renderCompare(false);updateSend();}
  else if(act==="winmode"){s.modes=s.modes||{};s.modes[mid]=b.dataset.m;persist();renderCompare(false);}
  else if(act==="winsend"){
    const ta2=$('.cwin-in[data-mid="'+mid+'"]');const txt=ta2?ta2.value:"";
    if(isBusy(s,mid)||txt.trim()||pend.atts.length||pend.links.length){winDrafts[mid]="";if(ta2)ta2.value="";sendToModel(s,mid,txt);}
  }
else if(act==="copy"&&r)navigator.clipboard.writeText(r.text||"").then(()=>toast("Copied"),()=>toast("Copy isn't allowed in this view."));
  else if(act==="star"&&r){r.star=!r.star;persist();refresh(s,false);}
  else if(act==="retry"&&t&&m)retryReply(s,t.id,mid);
  else if(act==="export")exportMd(s);
  else if(act==="delsess"){
    if(!b.dataset.armed){b.dataset.armed="1";toast("Click the bin again to delete this "+(s.kind==="compare"?"comparison":"chat")+".");setTimeout(()=>{delete b.dataset.armed;},3000);return;}
    if(s.kind==="compare"){H.compares=H.compares.filter(x=>x.id!==s.id);H.activeCmp=null;}
    else{const cm=curModel();H.chats[cm.id]=chatList(cm.id).filter(x=>x.id!==s.id);delete H.activeChat[cm.id];}
    persist();renderAll();toast("Deleted.");
  }else if(act==="dlvid"&&r&&m){
    const v=r.vids&&r.vids[+b.dataset.ii];if(v&&v.blob)saveFile(safeName(m.label)+"-video.mp4",v.blob);
  }else if(act==="dlimg"&&r&&m){
    const im=r.imgs[+b.dataset.ii];if(!im)return;
    if(im.type==="svg")saveFile(safeName(m.label)+"-image.svg",im.svg);
    else if(im.src.startsWith("data:")){const bl=dataUrlToBlob(im.src);const ext=({"image/jpeg":"jpg","image/webp":"webp","image/gif":"gif"})[bl.type]||"png";saveFile(safeName(m.label)+"-image."+ext,bl);}
    else navigator.clipboard.writeText(im.src).then(()=>toast("Image URL copied"),()=>toast("Open the image and save it from there."));
  }
}

  if(t.dataset&&t.dataset.act==="winon"){

    if(t.checked){if(i>=0)s.off.splice(i,1);}else if(i<0)s.off.push(t.dataset.mid);
    persist();renderCompare(false);updateSend();
  }
});
let syncing=false;

  $$(".cwin-body",$("#cmpBody")).forEach(b=>{if(b!==t){const m2=b.scrollHeight-b.clientHeight;b.scrollTop=ratio*m2;}});

$("#setBody").addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,card=b.closest(".card");
  const conn=card&&card.dataset.cid?connById(card.dataset.cid):null;
  if(act==="reveal"){const inp=b.previousElementSibling;inp.type=inp.type==="password"?"text":"password";b.textContent=inp.type==="password"?"Show":"Hide";}
  else if(act==="ctest"&&conn){
    const out=$("[data-out]",card);out.className="out";
    const m=firstModelFor(conn);
    if(!m){out.className="out bad";out.textContent="Add or enable a model that uses this connection first (Models tab).";return;}
    out.textContent="Testing…";const r=await testWith(conn,m.modelId);out.textContent=r.msg;out.className="out "+(r.ok?"ok":"bad");
  }else if(act==="itest"&&conn){
    const out=$("[data-iout]",card);out.className="out";out.textContent="Generating a test image…";
    const m=firstModelFor(conn);
    if(!imgSpecs(conn,m?m.modelId:"x").length){out.className="out bad";out.textContent="No image API is configured for this connection.";return;}
    const ac=new AbortController(),to=setTimeout(()=>ac.abort("timeout"),120000);
    try{const g=await imgTry(conn,m?m.modelId:"x","a simple blue circle on a white background, flat minimal style",ac.signal);
      out.className="out ok";out.innerHTML="✓ Image generated in "+(g.ms/1000).toFixed(1)+"s<img alt=\"Test image\" src=\""+esc(g.imgs[0].src)+"\">";}
    catch(err){out.className="out bad";out.textContent="✗ "+err.message+" — try another method or image model ID.";}
    finally{clearTimeout(to);}
  }else if(act==="discover"&&conn){
    disc[conn.id]={msg:"Fetching the model list…"};renderSettings();
    try{
      const all=await fetchModelList(conn),picks=pickPopular(all,28);
      const sel=new Set();picks.forEach((x,i)=>{if(x.pre&&!S.models.some(m=>m.conn===conn.id&&m.modelId===x.id))sel.add(i);});
      disc[conn.id]={items:picks,all,sel,msg:picks.length?"Found "+all.length+" models — "+picks.length+" popular ones listed. Tick the ones you want.":"No popular chat models recognised — add model IDs manually."};
    }catch(err){disc[conn.id]={msg:"Couldn't fetch the list ("+err.message+"). Check the base URL and key, or enable the local proxy if this is a CORS block."};}
    renderSettings();
  }else if(act==="dall"&&conn){const d=disc[conn.id];if(d&&d.items){d.sel=new Set(d.items.map((x,i)=>i));renderSettings();}}
  else if(act==="dnone"&&conn){const d=disc[conn.id];if(d&&d.items){d.sel=new Set();renderSettings();}}
  else if(act==="dadd"&&conn){
    const d=disc[conn.id];if(!d||!d.items)return;
    const chosen=d.items.filter((x,i)=>d.sel.has(i)),n=addModelsFrom(conn,chosen);
    const im=(d.all||[]).find(x=>x.imgOut);if(im&&!conn.imgModel&&conn.protocol==="openai"){conn.imgMode="chat";conn.imgModel=im.id;saveS();}
    disc[conn.id]=Object.assign({},d,{msg:"Added "+n+" model"+(n===1?"":"s")+" — they now appear in the sidebar and Compare."});
    renderAll();renderSettings();toast("Added "+n+" model"+(n===1?"":"s"));
  }else if(act==="qc"){
    const out=$("#qcOut"),key=$("#qcKey").value.trim();out.className="out";
    if(!key){out.className="out bad";out.textContent="Paste an API key first.";return;}
    let pid=$("#qcPreset").value;if(pid==="auto")pid=detectPreset(key);
    const p=PRESETS.find(x=>x.id===pid);
    if(!p||!p.base){out.className="out bad";out.textContent="I can't tell which provider this key belongs to — pick one in the list, or add a custom connection below.";return;}
    let conn2=S.conns.find(c=>c.preset===p.id&&c.id!=="cc"&&(!c.key||c.key===key));
    if(!conn2){conn2=mkConn(p,{color:PALETTE[S.conns.length%PALETTE.length]});S.conns.push(conn2);}
    conn2.key=key;saveS();out.textContent="Detected "+p.name+" — discovering popular models…";
    try{
      const all=await fetchModelList(conn2),picks=pickPopular(all,28),chosen=picks.filter(x=>x.pre),n=addModelsFrom(conn2,chosen);
      const im=all.find(x=>x.imgOut);if(im&&!conn2.imgModel&&conn2.protocol==="openai"){conn2.imgMode="chat";conn2.imgModel=im.id;saveS();}
      renderAll();renderSettings();
      const o2=$("#qcOut");o2.className="out ok";o2.textContent="✓ "+p.name+" connected · added "+n+" popular model"+(n===1?"":"s")+(n?": "+chosen.slice(0,5).map(x=>x.name).join(", ")+(chosen.length>5?"…":""):"");
    }catch(err){renderSettings();const o2=$("#qcOut");o2.className="out bad";o2.textContent="✓ "+p.name+" saved, but the model list couldn't be fetched ("+err.message+"). Add models in the Models tab, or enable the local proxy if this is a CORS block.";}
  }else if(act==="allon"||act==="alloff"){
    S.models.forEach(m=>{m.on=act==="allon";});saveS();renderSettings();renderAll();
  }else if(act==="cdel"&&conn)arm(b,"Click again to delete",()=>{
    S.models.forEach(m=>{if(m.conn===conn.id)m.conn="cc";});S.conns=S.conns.filter(x=>x.id!==conn.id);saveS();renderSettings();renderAll();
  });
  else if(act==="cadd"){
    const p=PRESETS.find(x=>x.id===$("#presetSel").value)||PRESETS[PRESETS.length-1];
    S.conns.push(mkConn(p,{color:PALETTE[S.conns.length%PALETTE.length]}));saveS();renderSettings();
    const cards=$$("[data-cid]",$("#setBody"));if(cards.length)cards[cards.length-1].scrollIntoView({block:"center"});
  }else if(act==="mtest"){
    const row=b.closest(".mrow"),out=$("[data-out]",row);out.className="out";out.textContent="Testing…";
    const r=await testModelRow(row.dataset.mid);out.textContent=r.msg;out.className="out "+(r.ok?"ok":"bad");
  }else if(act==="mfetch")fetchIds($("#fetchConn").value);
  else if(act==="madd"){
    const cid=(S.conns[1]&&S.conns[1].id)||"cc";
    const nm={id:"m"+uid(),label:"Custom model",modelId:"",color:PALETTE[S.models.length%PALETTE.length],on:false,conn:cid,custom:true};
    S.models.push(nm);saveS();renderSettings();
    const row=$('[data-mid="'+nm.id+'"]',$("#setBody"));if(row){row.scrollIntoView({block:"center"});const inp=$('[data-k="label"]',row);inp.focus();inp.select();}
  }else if(act==="mrm"){
    const row=b.closest(".mrow");S.models=S.models.filter(m=>m.id!==row.dataset.mid);saveS();renderSettings();renderAll();
  }else if(act==="clear-chats")arm(b,"Click again to confirm",async()=>{H={chats:{},activeChat:{},compares:[],activeCmp:null};await DB.set("nexus",H);renderAll();toast("All chats deleted.");});
  else if(act==="clear-keys")arm(b,"Click again to confirm",()=>{S.conns.forEach(c=>{c.key="";});saveS();renderAll();renderSettings();toast("All API keys removed.");});
});
$("#setBody").addEventListener("change",e=>{
  const t=e.target,card=t.closest(".card");
  if(t.dataset.di!==undefined&&card&&card.dataset.cid){
    const d=disc[card.dataset.cid];if(!d)return;
    const i=+t.dataset.di;if(t.checked)d.sel.add(i);else d.sel.delete(i);
    const cnt=$("[data-dcount]",card);if(cnt)cnt.textContent=d.sel.size;return;
  }
  if(t.dataset.px){
    S.proxy=S.proxy||{on:false,url:"",seen:true};
    if(t.dataset.px==="on")S.proxy.on=t.checked;else S.proxy.url=t.value.trim();
    S.proxy.seen=true;saveS();return;
  }
  if(t.dataset.cf&&card&&card.dataset.cid){
    const c=connById(card.dataset.cid),k=t.dataset.cf;if(!c)return;
    if(t.type==="checkbox")c[k]=t.checked;
    else c[k]=(k==="name")?(t.value.trim()||c.name):(k==="chatPath"||k==="imgPath"||k==="modelsPath"||k==="imgModel"||k==="base"||k==="key"?t.value.trim():t.value);
    if(k==="protocol"){
      if(t.value==="anthropic"){if(!c.base)c.base="https://api.anthropic.com/v1";c.imgMode="none";}
      if(t.value==="gemini"){if(!c.base)c.base="https://generativelanguage.googleapis.com/v1beta";}
    }
    saveS();
    if(k==="key"){const pill=$(".state",card);pill.textContent=c.key?"key saved":"no key";pill.classList.toggle("ok",!!c.key);}
    if(k==="protocol"||k==="imgMode"||k==="videoMode")renderSettings();
    if(k==="name")renderSettings();
    renderNav();renderHead();updateSend();
  }else if(t.dataset.k){
    const row=t.closest(".mrow"),m=modelById(row.dataset.mid);if(!m)return;
    if(t.dataset.k==="on"){m.on=t.checked;const oc=$("#onCount");if(oc)oc.textContent=enabled().length+" on · "+S.models.length+" total";}
    else m[t.dataset.k]=t.value.trim();
    saveS();
    if(t.dataset.k==="label"||t.dataset.k==="modelId"||t.dataset.k==="conn"){const old=$(".av",row);if(old){const tmp=document.createElement("div");tmp.innerHTML=avHTML(m);old.replaceWith(tmp.firstElementChild);}}
    renderNav();renderHead();if(S.view==="compare")renderCompare(false);else renderChat(false);updateSend();
  }else if(t.dataset.s){
    const k=t.dataset.s;
    if(t.type==="checkbox")S[k]=t.checked;
    else if(k==="maxTokens")S[k]=Math.min(64000,Math.max(256,parseInt(t.value,10)||4096));
    else S[k]=t.value;
    saveS();
  }
});
